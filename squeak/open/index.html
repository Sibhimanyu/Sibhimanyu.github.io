<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>Opening Squeak…</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; background: #09090b; color: #f4f4f5;
         display: grid; place-items: center; min-height: 100vh; text-align: center; }
  main { padding: 24px; max-width: 360px; }
  a.btn { display: block; margin-top: 20px; padding: 14px; border-radius: 8px; background: #fcd02c; color: #18181b;
          font-weight: 600; text-decoration: none; }
  p { color: #a1a1aa; }
</style>
</head>
<body>
<main>
  <h1>Opening Squeak</h1>
  <p>If nothing happens, tap the button. It opens Squeak on this session.</p>
  <a class="btn" id="go" href="squeak://open">Open in Squeak</a>
</main>
<script>
  // Telegram buttons can only open https links; this page hands the session
  // on to the app. The session id rides in the fragment (after #), which
  // browsers never send to a server.
  var match = /(?:^|&)s=([0-9A-Fa-f-]{8,64})(?:&|$)/.exec(location.hash.slice(1));
  var target = match ? "squeak://open?s=" + match[1] : "squeak://open";
  document.getElementById("go").href = target;
  location.replace(target);
</script>
</body>
</html>
