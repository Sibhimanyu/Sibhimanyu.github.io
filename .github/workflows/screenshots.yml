name: Refresh screenshots
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - run: node scripts/stamp.mjs
      - name: Commit changed screenshots
        run: |
          if [ -n "$(git status --porcelain assets index.html js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets index.html js
            git commit -m "Refresh project screenshots and stamp URLs"
            git push
          else
            echo "No screenshot changes"
          fi
